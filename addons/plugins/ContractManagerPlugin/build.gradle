plugins {
    id 'java'
    id 'org.jetbrains.intellij' version '1.3.0'
}

group 'com.jelurida.contract.manager.plugin'
version '2.3.0'

//sourceSets {
//    main {
//        java {
//            srcDirs = ['src/main/java', '../../../src/java']
//            exclude 'nxtdesktop'
//        }
//    }
//}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':ardor-classes')
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.7.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.7.0'
}

// See https://github.com/JetBrains/gradle-intellij-plugin/
intellij {
    version = '2021.3'
    plugins = ['com.intellij.java']
    updateSinceUntilBuild = true
}
patchPluginXml {
    changeNotes = ''
    sinceBuild = '211'
    untilBuild = '224' //TODO check again in 2022 if the plugin is compatible
}
test {
    useJUnitPlatform()
}